name: Build ARSH Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip ARSH project
        run: |
          mkdir arsh-project
          unzip -q ARSH-Android-fixed.zip -d arsh-project

      - name: Find project
        run: |
          find arsh-project -name settings.gradle.kts -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        working-directory: arsh-project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARSH-AAB
          path: arsh-project/**/build/outputs/bundle/release/*.aab
